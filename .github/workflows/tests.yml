name: Python simulation checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate example experiments
        run: python run_experiments.py --requests 120 --seed 42 --arrival-rate 1.2
      - name: Upload sample outputs
        uses: actions/upload-artifact@v4
        with:
          name: simulation-example-output
          path: results/
